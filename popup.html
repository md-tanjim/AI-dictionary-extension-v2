<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Smart Dictionary</title>
    <style>
      :root {
        --bg: #050816;
        --card-bg: #050816;
        --text-main: #ffffff;
        --text-muted: #9ca3af;
        --accent: #60a5fa;
        --accent-soft: #1e293b;
        --border-subtle: #1f2933;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 12px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: radial-gradient(circle at top, #111827 0, #020617 60%);
        color: var(--text-main);
        width: 360px;
      }

      .card {
        border-radius: 18px;
        overflow: hidden;
        background: radial-gradient(circle at top, #0f172a 0, #020617 60%);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.12);
      }

      .hero {
        position: relative;
        height: 130px;
        overflow: hidden;
      }

      .hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .hero-gradient {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(15, 23, 42, 0.3),
          rgba(15, 23, 42, 1)
        );
      }

      .card-body {
        padding: 10px 16px 14px 16px;
      }

      /* Tabs */
      .tabs {
        display: flex;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
        padding: 3px;
        margin-bottom: 10px;
      }

      .tab {
        flex: 1;
        font-size: 11px;
        text-align: center;
        padding: 4px 0;
        border-radius: 999px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--text-muted);
      }

      .tab.active {
        background: linear-gradient(to right, #3b82f6, #a855f7);
        color: #ffffff;
      }

      .top-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: flex-start;
      }

      .word-block {
        max-width: 250px;
      }

      #wordDisplay {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .ipa-pos {
        margin-top: 2px;
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 11px;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      #ipa {
        letter-spacing: 0.06em;
      }

      .pos-tag {
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.12);
        border: 1px solid rgba(148, 163, 184, 0.35);
        font-size: 10px;
      }

      .model-select {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
      }

      .model-label {
        font-size: 9px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.12em;
      }

      #modelSelect {
        background: rgba(15, 23, 42, 0.9);
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        color: var(--text-main);
        font-size: 11px;
        padding: 4px 8px;
        outline: none;
      }

      .input-row {
        margin-top: 10px;
        display: flex;
        gap: 6px;
        align-items: center;
      }

      #inputText {
        flex: 1;
        background: rgba(15, 23, 42, 0.9);
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        padding: 6px 10px;
        font-size: 11px;
        color: var(--text-main);
        outline: none;
      }

      #lookupBtn {
        padding: 6px 10px;
        border-radius: 999px;
        border: none;
        font-size: 11px;
        background: linear-gradient(to right, #3b82f6, #a855f7);
        color: white;
        cursor: pointer;
        white-space: nowrap;
      }

      #lookupBtn:active {
        transform: translateY(1px);
      }

      .section-title {
        text-transform: uppercase;
        font-size: 10px;
        letter-spacing: 0.18em;
        color: var(--text-muted);
        margin-top: 12px;
        margin-bottom: 3px;
      }

      .definition-text {
        font-size: 12px;
        line-height: 1.4;
      }

      .bangla-text {
        font-size: 14px;
        margin-top: 2px;
      }

      #sentences {
        padding-left: 14px;
        margin: 4px 0 0 0;
        font-size: 12px;
      }

      #sentences li {
        margin-bottom: 4px;
      }

      .bottom-row {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(148, 163, 184, 0.18);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .syn-ant {
        font-size: 10px;
        line-height: 1.4;
      }

      .syn-ant-label {
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.14em;
      }

      #synonyms,
      #antonyms {
        font-size: 11px;
        margin-top: 2px;
      }

      .speak-btn {
        border-radius: 999px;
        width: 32px;
        height: 32px;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(37, 99, 235, 0.18);
        cursor: pointer;
      }

      .speak-btn span {
        font-size: 16px;
      }

      .speak-btn:active {
        transform: translateY(1px);
      }

      #error {
        margin-top: 6px;
        font-size: 11px;
        color: #f97373;
      }

      /* History styles */
      #historyPanel {
        display: none;
      }

      .history-list {
        max-height: 210px;
        overflow-y: auto;
        margin-top: 6px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(148, 163, 184, 0.18);
        padding: 6px 8px;
      }

      .history-row {
        display: grid;
        grid-template-columns: minmax(60px, 120px) 12px minmax(80px, 1fr);
        column-gap: 4px;
        font-size: 11px;
        padding: 3px 0;
      }

      .history-word {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding-right: 4px;
      }

      .history-dash {
        text-align: center;
      }

      .history-bangla {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .history-empty {
        font-size: 11px;
        color: var(--text-muted);
        text-align: center;
        padding: 16px 4px;
      }

      .history-actions {
        margin-top: 8px;
        display: flex;
        justify-content: flex-end;
        gap: 6px;
      }

      .history-btn {
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 11px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.9);
        color: var(--text-main);
        cursor: pointer;
      }

      .history-btn:active {
        transform: translateY(1px);
      }

      .history-btn.primary {
        border: none;
        background: linear-gradient(to right, #3b82f6, #a855f7);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="hero">
        <img src="sunrise.png" alt="sunrise" />
        <div class="hero-gradient"></div>
      </div>

      <div class="card-body">
        <!-- Tabs -->
        <div class="tabs">
          <div id="tabDictionary" class="tab active">Dictionary</div>
          <div id="tabHistory" class="tab">History</div>
        </div>

        <!-- Dictionary Panel -->
        <div id="dictPanel">
          <div class="top-row">
            <div class="word-block">
              <div id="wordDisplay">Word</div>
              <div class="ipa-pos">
                <span id="ipa">/ˈwɜːd/</span>
                <span id="posTag" class="pos-tag">NOUN</span>
              </div>
            </div>
            <div class="model-select">
              <div class="model-label">Model</div>
              <select id="modelSelect">
                <option value="openai">OpenAI</option>
                <option value="gemini">Gemini</option>
              </select>
            </div>
          </div>

          <div class="input-row">
            <input
              id="inputText"
              placeholder="Select a word or type here..."
            />
            <button id="lookupBtn">Lookup</button>
          </div>

          <div class="section-title">Definition</div>
          <div id="definition" class="definition-text"></div>

          <div class="section-title">Bangla Translation</div>
          <div id="bangla" class="bangla-text"></div>

          <div class="section-title">Example Sentences</div>
          <ol id="sentences"></ol>

          <div class="bottom-row">
            <div class="syn-ant">
              <div class="syn-ant-label">Synonyms</div>
              <div id="synonyms"></div>
              <div class="syn-ant-label" style="margin-top: 4px;">Antonyms</div>
              <div id="antonyms"></div>
            </div>

            <button id="speakBtn" class="speak-btn" title="Play audio">
              <span>🔊</span>
            </button>
          </div>

          <div id="error"></div>
        </div>

        <!-- History Panel -->
        <div id="historyPanel">
          <div class="section-title">History (last 50)</div>
          <div id="historyList" class="history-list">
            <!-- rows injected here -->
          </div>
          <div class="history-actions">
            <button id="clearHistoryBtn" class="history-btn">
              Clear
            </button>
            <button id="downloadHistoryBtn" class="history-btn primary">
              Download
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
